<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI General Knowledge Quiz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 {
            color: #333;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background: #0056b3;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="quiz-container">
        <h2>🤖 AI General Knowledge Quiz</h2>
        <hr>
        <div id="question-box">
            <p id="question-text">Loading question...</p>
            <div id="options-box"></div>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "What is the capital of France?",
                options: ["Berlin", "Madrid", "Paris", "Rome"],
                answer: "Paris"
            },
            {
                question: "Which planet is known as the Red Planet?",
                options: ["Earth", "Mars", "Jupiter", "Venus"],
                answer: "Mars"
            },
            {
                question: "What is the largest mammal on Earth?",
                options: ["Elephant", "Blue Whale", "Giraffe", "Great White Shark"],
                answer: "Blue Whale"
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function loadQuiz() {
            const qBox = document.getElementById("question-text");
            const optBox = document.getElementById("options-box");
            optBox.innerHTML = "";

            if (currentQuestion < quizData.length) {
                qBox.innerText = `Q${currentQuestion + 1}: ${quizData[currentQuestion].question}`;
                quizData[currentQuestion].options.forEach(option => {
                    const btn = document.createElement("button");
                    btn.innerText = option;
                    btn.className = "btn";
                    btn.onclick = () => selectAnswer(option);
                    optBox.appendChild(btn);
                });
            } else {
                document.getElementById("quiz-container").innerHTML = `
                    <h2>Quiz Completed! 🎉</h2>
                    <p>Your Score: <b>${score} / ${quizData.length}</b></p>
                    <button class="btn" onclick="location.reload()">Play Again</button>
                `;
            }
        }

        function selectAnswer(selected) {
            if (selected === quizData[currentQuestion].answer) {
                score++;
            }
            currentQuestion++;
            loadQuiz();
        }

        loadQuiz();
    </script>

</body>
</html>
